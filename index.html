<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT do IT! · AlienEX Studio</title>
<meta name="description" content="IT do IT! 스타트업 타이쿤 — 1990년 PC 통신부터 AI 시대까지, 픽셀 사무실에서 내 IT 회사를 키워 상장에 도전하는 경영 게임.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #18191c; --panel: #222328; --edge: #b08c46; --gold: #e6be6e; --text: #f2f2f4; --muted: #a3a6ae; }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
  main { width: 100%; max-width: 640px; margin: 0 auto; padding: 56px 16px 40px; text-align: center; }
  .icon { width: 128px; height: 128px; border-radius: 28px; border: 2px solid var(--edge); }
  h1 { margin: 20px 0 4px; font-size: 40px; letter-spacing: -0.5px; }
  .sub { margin: 0; color: var(--gold); font-weight: 700; }
  .card { margin: 28px 0; padding: 20px 22px; background: var(--panel); border: 1px solid #34353b; border-radius: 16px; text-align: left; }
  .card p { margin: 0 0 10px; }
  .card p:last-child { margin-bottom: 0; }
  .en { color: var(--muted); font-size: 15px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .links a { display: inline-block; max-width: 100%; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--edge); color: var(--text); text-decoration: none; font-weight: 700; }
  .links a:hover { background: #2c2d33; }
  footer { margin-top: 36px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="IT do IT! 아이콘">
  <h1>IT do IT!</h1>
  <p class="sub">스타트업 타이쿤 · Startup Tycoon</p>

  <div class="card">
    <p>1990년 PC 통신부터 AI 시대까지, 픽셀 사무실에서 내 IT 회사를 키워 상장에 도전해요.</p>
    <p class="en">Build an IT startup from dial-up to AI in a pixel office, then take it public.</p>
  </div>

  <div class="links">
    <a href="https://play.google.com/store/apps/details?id=com.alienex.itdoit">Google Play</a>
    <a href="https://sites.google.com/view/it-do-it-privacy-policy">개인정보처리방침 · Privacy Policy</a>
    <a href="mailto:alienagry@gmail.com">문의 · Contact</a>
  </div>

  <footer>© 2026 AlienEX Studio</footer>
